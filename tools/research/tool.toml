[[entry]]
namespace = "research"
name = "run"
title = "Run a research"
description = "Send a web research out at a depth, answered at once with the run's id, its state and the road it went out on, or why it cannot go out now. The key is the depth: search:basic for a question after one value or one fact, search:thorough for a question with a few angles, search:exhaustive for a deep dive, browse for a task that must open and click through pages. Write the question whole, as the owner means it, and name roomId, the room this turn answers, so the result comes back there. Name a model, with its provider where one is meant, only where the owner named one for this research; with none named, the role's own road carries it. The result comes back to the room as an instruction once the run ends: the answer in a line or two and its document's link."
input = "run.json"
capabilities = ["research.ask"]

[entry.listing]
line = "- run — send a web research out at a depth; its result comes back to the room"
order = 11

[[entry]]
namespace = "research"
name = "rulebook"
title = "Read a rulebook"
description = "Read one of the rulebooks this search run was handed, whole, once its deciding section says it applies; a name it was not handed is refused with the names it was."
input = "rulebook.json"
hints = { read_only = true }
capabilities = ["web.rulebooks"]

[entry.listing]
line = "- rulebook — read a rulebook this search was handed, whole"
order = 12

[[entry]]
namespace = "research"
name = "skill"
title = "Read a research skill"
description = "Read one research skill whole: the rules a kind of research and its answer are held to, with the asker's own rule for that kind where they keep one. Before answering such a request yourself, read the skill for its kind: bmo-research-restaurants for places to eat or food to order, bmo-research-products for a thing to buy or a price, bmo-research-investment for where to put money or a stock forecast, bmo-research-study-material for material to learn a subject from, bmo-research-security-advisories for a vulnerability or an advisory, bmo-research-economy-brief for a brief of a day's economic news, bmo-research-deep-dives and bmo-research-routine for a deep look at a thing somebody made, bmo-research-kinds for what any search checks and attaches, and bmo-docs-plain-writing for how the words read. Name the asker so their own rule comes with it."
input = "skill.json"
hints = { read_only = true }
capabilities = ["research.ask"]

[entry.listing]
line = "- skill — read the research skill a kind of request is held to, with the asker's own rule"
order = 13
