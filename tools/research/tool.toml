# The research unit's tool: every entry of the namespace `research`, answered by one executable calling the
# daemon's routes (docs/api.md, "The tools"). The tests hold the entries here to the executable's. A call ends
# with the daemon's answer or its caller going away, never on a clock.

[tool]
name = "researcher"
protocol = 1
language = "rust"
build = 'cargo build --release -p research-tool && cp "$BMO_CARGO_TARGET/release/research-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p research-checks --test main tool::'
run = ["research-tool"]

[[entry]]
namespace = "research"
name = "ask"
title = "Ask for research"
description = "Queue a thing for the research daemon by its name and its maker's address; it is researched before anything the sources turned up, and its report comes back to the room. Say why it is asked in because; where it follows from an earlier research, name that item in follows, or its document in document, so the report names the step it followed from."
input = "ask.json"
capabilities = ["research.ask"]

[entry.listing]
line = "- ask — queue a thing for research by its name and its maker's address"
order = 1

[[entry]]
namespace = "research"
name = "queue"
title = "Research queue"
description = "List the research queue: what runs, what waits, and what was reported, each with its state and its report's link."
input = "queue.json"
hints = { read_only = true }
capabilities = ["research.ask"]

[entry.listing]
line = "- queue — the research queue, by category and state"
order = 2

[[entry]]
namespace = "research"
name = "taken"
title = "Mark research taken"
description = "Record that a reported item is taken: the job item filed for it on the owner's word is kept on the item."
input = "taken.json"
capabilities = ["research.owner"]

[entry.listing]
line = "- taken — record the job item filed for a reported item"
order = 3

[[entry]]
namespace = "research"
name = "dismiss"
title = "Dismiss research"
description = "Dismiss a research item on the owner's word; nothing turns it up again."
input = "dismiss.json"
capabilities = ["research.owner"]

[entry.listing]
line = "- dismiss — dismiss a research item on the owner's word"
order = 4

[[entry]]
namespace = "research"
name = "categories"
title = "Research categories"
description = "List the research categories, or, on the owner's word, add, change or remove one. A category of the shape topic is gathered every gatherMinutes under its own instruction, and may name the calendar its dated findings are written to."
input = "categories.json"
capabilities = ["research.ask"]

[entry.listing]
line = "- categories — the research categories; adding, changing and removing them is the owner's"
order = 5

[[entry]]
namespace = "research"
