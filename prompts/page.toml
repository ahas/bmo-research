# The words a deep dive's page is drawn with (docs/runner.md, "The page"; docs/api.md, "The page"): one set
# per language the page may hold, in the order its switch lists them, Korean first, the owner's. `name` is
# the language named in its own words on the switch, `switch` what the switch is called for a screen reader,
# and `listen` the heading of the listen band, saying the sound is to be heard while reading. The rest are the
# line under the title saying where the research came from: `origin` its label, then one of `source` (the
# source that found the item, {source} its kind and what it reads), `asked` (the owner's ask), `follow_up`
# (an ask made from an earlier research, {document} that document's number and {title} its title, linked
# where its live link is known) or `follow_up_untitled` where no title is known, then `because` where the
# ask said why, {because} its words. The English words are also the line the question hands the run.

[[language]]
code = "ko"
name = "한국어"
switch = "언어"
listen = "들으면서 보세요"
origin = "어디서 나온 조사인가"
source = "{source} 소스가 찾아 온 항목입니다."
asked = "사장님이 직접 맡기신 조사입니다."
follow_up = "문서 {document} 「{title}」의 후속 조사입니다."
follow_up_untitled = "문서 {document}의 후속 조사입니다."
because = "요청한 말: «{because}»"

[[language]]
code = "en"
name = "English"
switch = "Language"
listen = "Listen while you read"
origin = "Where this research came from"
source = "Found by the source {source}."
asked = "Asked for by the owner."
follow_up = "A follow-up of document {document}, 「{title}」."
follow_up_untitled = "A follow-up of document {document}."
because = "In the asker's words: «{because}»"

# The title a page falls back on where the result names none, by the item's shape and the page's language.
# {name} is the item's name.
[titles.en]
manual = "{name} manual"
investigation = "{name} investigation"
advisory = "{name} security advisory"
brief = "Economy brief: {name}"

[titles.ko]
manual = "{name} 사용설명서"
investigation = "{name} 조사"
advisory = "{name} 보안 권고"
brief = "경제 브리핑: {name}"
