# The words a deep dive's page is drawn with (docs/runner.md, "The page"; docs/api.md, "The page"): one set
# per language the page may hold, in the order its switch lists them, Korean first, the owner's. `name` is
# the language named in its own words on the switch and `switch` what the switch is called for a screen
# reader.

[[language]]
code = "ko"
name = "한국어"
switch = "언어"

[[language]]
code = "en"
name = "English"
switch = "Language"

# The title a page falls back on where the result names none, by the item's shape and the page's language.
# {name} is the item's name.
[titles.en]
manual = "{name} manual"
investigation = "{name} investigation"
advisory = "{name} security advisory"
brief = "Economy brief: {name}"

[titles.ko]
manual = "{name} 사용설명서"
investigation = "{name} 조사"
advisory = "{name} 보안 권고"
brief = "경제 브리핑: {name}"
