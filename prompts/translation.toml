# The words agency's translator is handed with a deep dive's page and its narration (docs/api.md, "The
# page"). The translator reads them, so they are English. {name} is the researched thing's name.

# The language the owner's copy is rendered in, as the translator's instructions ask for it.
language = "Korean"

# The note every part of the body and the description carry.
note = "This text is part of a research report about {name}, written for the owner. Keep model, product and dataset names, figures, units, code, links and the fixed section names exactly as they are written. Write in the register of the owner's documents."

# The note a narration's script carries when it is translated to be spoken.
narration_note = "This text is the spoken narration of a research report about {name}, read aloud to the owner. Translate it to be heard: short sentences, every figure written the way a speaker reads it aloud, and model and product names kept exactly as they are written."
