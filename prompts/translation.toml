# The words agency's translator is handed with a deep dive's page and its narration (docs/api.md, "The
# page"). The translator reads them, so they are English. {name} is the researched thing's name.

# The language the owner's copy is rendered in, as the translator's instructions ask for it.
language = "Korean"

# The note every part of the body and the description carry; what a part keeps exactly as written goes to the
# translator as its terms (docs/api.md, "The page").
note = "This text is part of a research report about {name}, written for the owner, in the register of the owner's documents. A top-level heading opening it is the report's title: keep it a noun phrase naming the subject, never a sentence, of at most 15 Korean syllables."

# The note a narration's script carries when it is translated to be spoken. The translation is the narration's
# written words; the voice unit derives the spoken words from them.
narration_note = "This text is the spoken narration of a research report about {name}, read aloud to the owner and kept as its transcript. Translate it to be heard, in short sentences, and keep model, product and dataset names, acronyms, figures and units exactly as they are written: how each is read aloud is settled after you, so never write one as it sounds."
