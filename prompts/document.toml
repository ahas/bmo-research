# The words a filed document is read by, by the item's shape (docs/api.md, "The fit" and "The brief's
# facts"), one set per language a document may be written in: English first, the language every run is
# asked in, then Korean, the language the rulebooks name their sections in. A manual's are the research
# rulebook's: the heading of the section on running the thing in the lab, the label of its line of the
# cards it fits, the word that line says where none fits, and the heading of the reproduction plan; the
# English ones are those the manual's question names. An advisory's and a brief's are the ones their
# question templates under prompts/ ask for.

[[manual]]
language = "en"
heading = "Running it in our lab"
label = "Cards it fits on:"
none = "None"
plan_heading = "Draft reproduction plan"

[[manual]]
language = "ko"
heading = "우리 랩에서 구동하려면"
label = "들어가는 카드:"
none = "없음"
plan_heading = "재현 계획 초안"

# An advisory's exposure table: its column words, and the word a touched row's last cell opens with.
[[advisory]]
language = "en"
component = "Component"
version = "Version"
repository = "Repository"
host = "Host"
touched = "Touched"
yes = "Yes"
plan_heading = "Fixed version and patch steps"

[[advisory]]
language = "ko"
component = "구성 요소"
version = "버전"
repository = "저장소"
host = "호스트"
touched = "닿음"
yes = "예"
plan_heading = "수정판과 패치 절차"

# The column words of a brief's figures table.
[[brief]]
language = "en"
name = "Indicator"
value = "Value"
unit = "Unit"
as_of = "As of"
source = "Source"

[[brief]]
language = "ko"
name = "지표"
value = "값"
unit = "단위"
as_of = "기준일"
source = "출처"

# The column words of a topic's events table, and what its question says of the table and of the items its
# sources turned up (docs/design.md, "Categories"). In `items`, {items} is a line an item, its name and its
# address.
[[events]]
language = "en"
title = "Title"
start = "Start"
end = "End"
place = "Place"
source = "Source"

[[events]]
language = "ko"
title = "제목"
start = "시작"
end = "종료"
place = "장소"
source = "출처"

[topic]
items = """
These items came in from the topic's sources since its last report. Read each one yourself and take it into the report.

{items}
"""
events = """
Close the document with a section `Events` holding one table of every dated thing the report found: an event, a deadline, a release date. The table's header row is exactly these five columns.

| Title | Start | End | Place | Source |

Write Start and End as `YYYY-MM-DD`, or as `YYYY-MM-DD HH:MM` where the page states the time, in the local time of the place it happens. Leave End empty where it ends the day it starts. In the Source column, write the address of the page the date was read on, as a link. Leave out anything whose date the page does not state; where nothing dated was found, write the section with the header row alone.
"""

