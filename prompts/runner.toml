# What the research runner composes a run of (docs/runner.md): the search rulebooks and the rounds.

# The rulebooks a search is bound by, in this order, each named as it stands under prompts/rules/; the ones
# binding only some searches, of which only the section deciding whether each applies stands in the
# instructions, the run reading the rest with research/rulebook; and that section's heading. The
# plain-writing and self-preservation rulebooks follow them whole.
[search]
rulebooks = ["search-kinds", "product-search", "restaurant-search", "investment-search", "study-material", "deep-dives", "research", "security-advisory", "economy-brief"]
on_request = ["product-search", "restaurant-search", "investment-search", "study-material", "deep-dives", "research", "security-advisory", "economy-brief"]
applies_section = "Whether this rulebook applies at all"
plain_writing = "plain-writing"
self_preservation = "self-preservation"

# The rounds a run asks a session of their own after its first answer (docs/runner.md, 「The rounds」): the
# questions by name, each a rule the session is asked, and each research key's list, the depth deciding how
# hard an answer is checked. A list ends in `final` and holds it nowhere else, and every round of it is asked
# in turn, however long the rounds take.
[questions]
what = "Decide what this task must establish: the question it asks, each part of that question, and what would count as an answer. Say plainly what the sources this run may read cannot reach."
sources = "Name the sources the answer needs: the kind of page or document each fact can come from, and the search wordings that reach them. Read them with the web tools; a page the run did not read is not a source."
facts = "Check every fact the answer rests on against a second source where one exists, and mark what only one source states. Nothing undecided may stand as known: a value the run could not read is unknown, never guessed."
coverage = "Check the answer against the task: every part of the question answered, each fact carrying the source it came from, and what could not be confirmed said plainly. Name what still has to be found."
establish = "Write the facts and knowledge this run established into the shared brain with brain_learn, each with its source, after brain_similar shows the rows like it: a duplicate is confirmed or strengthened, a contradiction is closed. Then say which rows were written."
final = "Write the result now: the whole answer to the task, in the form the task asks for, resting only on the facts established above and citing the sources read. This answer is the run's result."

[rounds."search:basic"]
rounds = ["final"]

[rounds."search:thorough"]
rounds = ["what", "sources", "facts", "coverage", "establish", "final"]

[rounds."search:exhaustive"]
rounds = ["what", "sources", "facts", "coverage", "establish", "final"]

[rounds.browse]
rounds = ["what", "sources", "facts", "coverage", "establish", "final"]

# What an advisory's run is asked before its research begins (docs/runner.md, "The deep dive's page"): the
# vendor's fixed builds judged against the platform age floor the task names. The answer is one line, the
# marker alone, so the daemon can skip the run without a document or a notice.
[scope]
question = "Before any research, judge the advisory the task below names against the platform's age floor. Read only the advisory's own fixed builds and the dates the vendor gives them. Where the task states no floor stands, where a fixed build appeared at or after the floor, or where the advisory gives no date for one, write one line and nothing else: {inside}. Where every fixed build the advisory names appeared before the floor, write one line and nothing else: {outside}. Write no heading, no list, no result structure and nothing else."
outside = "OUT OF SCOPE"
inside = "IN SCOPE"

# What a run's session is asked where its result carries no `LISTEN:` script (docs/runner.md, 「The
# narration」): the question, and the rulebook and its section the narration is written by.
[narration]
question = "The answer you wrote last carries no narration. Write the narration alone now: the script for the ear the rule below states, in the language the question is asked in. Say what the thing is, the verdict, and the one thing a listener must know, in plain spoken sentences. Write no heading, no list, no structure line and nothing else: this turn's text is taken whole as the script."
rulebook = "search-kinds"
section = "The narration"

# What a deep dive's session is asked where its result is short of its shape (docs/runner.md, 「The deep
# dive's page」): the question, `{missing}` set to what the result lacks.
[whole]
question = "The answer you wrote last is not the whole document: {missing}. Write the whole result again from its head, every section in order: the ANSWERED and TITLE lines and the rest of the head, the narration where the task asks for one, VERDICT with the answer, then every section the task's shape asks for, through UNCONFIRMED and the sources. Write it whole in this one answer, never as a continuation of what you wrote before: this turn's text is taken whole as the result."

# What a deep dive's page is reviewed with once it is whole (docs/runner.md, 「The review」): the question, and
# the rulebook and its section the review is held to, which stand as the review session's instructions.
[review]
question = "Review the finished page below by the rules you were given: its English side, its Korean side and its two narrations. Where nothing needs fixing, write the line PASS and nothing else. Otherwise write each fix as a block of its own: first a line FIX: followed by the side and the part, which is en or ko and then the section's heading exactly as the English side writes it, or narration-en, or narration-ko; then a line WHY: followed by the fault in one sentence; then the part rewritten whole, a section with its heading line first. Write nothing before the first block and nothing between two blocks: each block is applied as it stands."
rulebook = "deep-dives"
section = "The review"
# The names the finished page's parts are handed under, each on a line of its own between the marks, and the
# word standing for a part the page has none of.
english = "The English side"
korean = "The Korean side"
english_narration = "The English narration"
korean_narration = "The Korean narration"
none = "None."
