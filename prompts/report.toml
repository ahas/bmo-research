# The words of the notices the daemon hands a category's recipients (docs/api.md, "The notices").
# {title}, {summary} and {link} are the page's Korean title, the first sentence of its Korean description and
# the document's one share link, told once the page is whole; {name} and {tries} are the item's name and the
# tries it took; {touches} is what an advisory names
# as touched; {plan} is the heading of the document's plan section; {repository} and {rows} a touched
# repository and its rows of the exposure table. In `restore`, {model} is a watched registration,
# {service} the arbiter service its engine is and {minutes} how long a run has waited for its card. Under [sources] stand the columns `bmo-research research sources` lists a source's
# readings with: {minutes} is how long ago it was last read, {taken} how many candidates its last reading
# that succeeded kept as new and {candidates} how many it turned up past the filter.

line = "{title} — {summary} {link}"
fit = "우리 카드에 들어간다고 적혀 있습니다. 사장님께 검수 여부를 여쭤 주세요."
touches = "우리 플랫폼의 {touches}에 닿는다고 적혀 있습니다. 저장소를 맡은 워커가 있으면 그 워커에게 따로 알렸습니다."
name = "대상: {name}"
plan = "계획은 문서의 「{plan}」 절에 있습니다."
# A touched repository's part, told to the worker that keeps it as a turn; workers read English.
worker = """Security notice: the advisory {name} touches the repository {repository}.
{rows}
The report: {link}
The patch steps stand in its section "{plan}".
This is a notice, not an order: what you do with it is your own rules' to decide."""
failed = "{name} 조사를 {tries}번 시도했지만 끝내지 못했습니다."
restore = "조사에 쓰는 {model} 모델({service})이 {minutes}분이 지나도록 카드를 받지 못해, 조사 한 건이 그대로 기다리고 있습니다."

[sources]
read = "마지막 읽음 {minutes}분 전"
unread = "마지막 읽음 없음"
taken = "가져온 수 {taken} (읽은 후보 {candidates})"
untaken = "가져온 수 없음"
