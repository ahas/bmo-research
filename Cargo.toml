# The workspace: the crates the research unit is built from under `crates/`, the tool's executable under
# `tools/research`, and the repository's own package at the root, which holds the tests that span them. The
# unit serves one API (`docs/api.md`).
[workspace]
members = ["crates/client", "crates/server", "tools/research"]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.12"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23.1"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
dotenvy = "0.15.7"
feed-rs = "3.0.0"
getrandom = "0.3.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
regex = "1.11.1"
libc = "0.2.174"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
pulldown-cmark-escape = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
schemars = "1.0.4"
scraper = "0.25.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
unicode-segmentation = "1.12.0"
url = "2.5.4"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"

[package]
name = "research-checks"
description = "The repository's tests: the checks that span every crate and a document."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
axum.workspace = true
base64.workspace = true
bmo-research-client = { path = "crates/client" }
libc.workspace = true
regex.workspace = true
research-server = { path = "crates/server" }
research-tool = { path = "tools/research" }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
